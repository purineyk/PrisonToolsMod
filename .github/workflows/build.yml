name: Build PrisonToolsMod

on:
  push:
  workflow_dispatch:

concurrency:
  group: prisontools-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download Gradle
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build mod
        run: /tmp/gradle-9.7.1/bin/gradle --no-daemon build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: PrisonToolsMod-jar
          path: build/libs/*.jar
          if-no-files-found: error
